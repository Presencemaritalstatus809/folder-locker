[project]
name = "folder-locker"
version = "1.0.0"
description = "Offline folder locker with AES-256-GCM encrypted containers and optional Windows ACL quick lock"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "HaoXiang Huang", email = "didadida1688@gmail.com" }
]
keywords = ["folder-locker", "encryption", "aes-gcm", "tkinter", "windows", "ntfs"]
dependencies = [
  "cryptography>=42"
]

[project.urls]
Homepage = "https://nextweb4.github.io/"
Repository = "https://github.com/NextWeb4/folder-locker"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PD", "PL", "TRY", "RUF"]
ignore = ["TRY003", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
